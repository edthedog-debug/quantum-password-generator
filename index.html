<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Quantum Password Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 0.5rem; text-align: center; }
        .privacy-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .output-box {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        #passwordDisplay {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: monospace;
            font-size: 1.1rem;
            outline: none;
            word-break: break-all;
        }
        button.copy-btn {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.copy-btn:hover { opacity: 0.9; }
        .controls { margin-bottom: 1.5rem; }
        .control-group { margin-bottom: 1rem; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .checkboxes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text); cursor: pointer; }
        button.generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button.generate-btn:hover { filter: brightness(1.1); }
        .footer-note {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quantum Password</h1>
        <div class="privacy-badge">🔒 100% Anonymous • Zero Data Stored • Local Only</div>
        
        <div class="output-box">
            <input type="text" id="passwordDisplay" readonly placeholder="Click generate...">
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="lengthRange">Length: <span id="lengthVal">16</span></label>
                <input type="range" id="lengthRange" min="8" max="64" value="16">
            </div>
            <div class="checkboxes">
                <label class="checkbox-label"><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                <label class="checkbox-label"><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                <label class="checkbox-label"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                <label class="checkbox-label"><input type="checkbox" id="symbols" checked> Symbols (!@#$)</label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Secure Password</button>
        <div class="footer-note">Executed locally via Web Crypto API. No logs kept.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
